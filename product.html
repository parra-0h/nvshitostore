<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nvshitostore — Producto</title>
<link rel="icon" href="/brand/logo.jpeg">
<link rel="stylesheet" href="/css/style.css">
<style>
  .product-detail-view {
    max-width: 1000px;
    margin: 40px auto 80px auto;
    padding: 0 28px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
  }
  
  @media (max-width: 768px) {
    .product-detail-view {
      grid-template-columns: 1fr;
    }
  }

  .product-image-col img {
    width: 100%;
    border-radius: 12px;
    background: #111;
  }
  
  .product-info-col {
    display: flex;
    flex-direction: column;
  }
  
  .prod-cat {
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 600;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  
  .prod-name {
    font-family: var(--font-display);
    font-size: 42px;
    line-height: 1.1;
    margin: 0 0 16px 0;
    text-transform: uppercase;
  }
  
  .prod-price {
    font-size: 24px;
    color: var(--text);
    margin-bottom: 24px;
  }
  
  .prod-desc {
    color: var(--text-muted);
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 32px;
    white-space: pre-wrap;
  }
  
  .btn-buy {
    background: var(--red);
    color: #000;
    text-decoration: none;
    text-align: center;
    padding: 16px 24px;
    border-radius: 8px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: 14px;
    transition: background 0.2s ease;
  }
  
  .btn-buy:hover {
    background: #ff433b;
  }
</style>
</head>
<body>

<header class="topbar">
  <a href="/" class="brand">
    <img src="/brand/logo.jpeg" alt="" class="brand-logo">
    <img src="/brand/name-logo.jpeg" alt="Nvshitostore" class="brand-name-logo">
  </a>
  <div class="topbar-right">
    <a href="/" class="nav-action">
      <span>VOLVER</span>
    </a>
    <div class="nav-divider"></div>
    <a href="https://instagram.com/nvshitostore" target="_blank" rel="noopener" class="nav-action nav-ig" aria-label="Instagram">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
      </svg>
    </a>
  </div>
</header>

<main>
  <div id="productDetail" class="product-detail-view">
    <!-- Carga desde JS -->
    <p>Cargando producto...</p>
  </div>
</main>

<footer>
  <p>© <span id="year"></span> Nvshitostore — Pedidos por Instagram <a href="https://instagram.com/nvshitostore" target="_blank" rel="noopener">@nvshitostore</a></p>
</footer>

<script src="/js/product.js"></script>
<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
